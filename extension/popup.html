<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ApplyQuest Clipper</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body class="popup">
  <header class="topbar">
    <span class="wordmark">ApplyQuest</span>
    <button class="act" id="settingsBtn">Settings</button>
  </header>

  <div id="viewUnauthenticated" class="view hidden">
    <p class="message">Not connected to ApplyQuest.</p>
    <button class="btn btn-primary btn-full" id="goToSettingsBtn">Open settings</button>
  </div>

  <div id="viewForm" class="view hidden">
    <form id="jobForm" class="form">
      <div class="field">
        <label for="jobTitle">Job title</label>
        <input type="text" id="jobTitle" required placeholder="Senior Software Engineer" />
      </div>
      <div class="field">
        <label for="companyName">Company</label>
        <input type="text" id="companyName" required placeholder="Acme GmbH" />
      </div>
      <div class="field">
        <label for="location">Location</label>
        <input type="text" id="location" required placeholder="Berlin, Germany" />
      </div>
      <div class="field-row">
        <div class="field">
          <label for="jobBoardSource">Source</label>
          <input type="text" id="jobBoardSource" placeholder="LinkedIn" />
        </div>
        <div class="field">
          <span class="field-label" id="priorityLabel">Priority</span>
          <div class="ticks" id="starsInput" role="radiogroup" aria-labelledby="priorityLabel">
            <button type="button" class="tick star" data-value="1" aria-label="Priority 1"></button>
            <button type="button" class="tick star" data-value="2" aria-label="Priority 2"></button>
            <button type="button" class="tick star" data-value="3" aria-label="Priority 3"></button>
            <button type="button" class="tick star" data-value="4" aria-label="Priority 4"></button>
            <button type="button" class="tick star" data-value="5" aria-label="Priority 5"></button>
          </div>
          <input type="hidden" id="priorityStars" value="0" />
        </div>
      </div>
      <div class="field">
        <label for="effort">Effort</label>
        <select id="effort">
          <option value="Unknown">Unknown</option>
          <option value="Full">Full — tailored CV and cover letter</option>
          <option value="Light">Light — some tailoring</option>
          <option value="Generic">Generic — standard CV, e.g. Easy Apply</option>
        </select>
      </div>
      <div class="field">
        <label for="notes">Notes</label>
        <textarea id="notes" rows="2" placeholder="Optional"></textarea>
      </div>

      <div id="errorMsg" class="verdict error-msg hidden" role="alert"></div>

      <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Add to ApplyQuest</button>
    </form>
  </div>

  <div id="viewSuccess" class="view hidden">
    <div class="saved">
      <span class="label">Shortlisted</span>
      <span class="readout">Saved</span>
      <a id="viewLink" href="#" target="_blank" class="act">Open ApplyQuest ›</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
