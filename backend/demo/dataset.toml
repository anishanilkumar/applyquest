# Source pools for the ApplyQuest demo dataset.
#
# Read by seed.py, which draws from these to build ~55 applications, their
# status histories, network contacts and point history every two days.
#
# Company names are deliberately fictional. Everything else — cities, job
# titles, tech stacks, job boards — is real, because the analytics page
# geocodes `location` against OpenStreetMap and groups by tech stack and
# source, so those fields have to be plausible for the charts to look like
# anything. Inventing a rejection and attributing it to a real named company
# on a public page is the one thing worth avoiding here.

# ---------------------------------------------------------------------------
# Role titles, weighted loosely toward backend/platform work so the tech-stack
# chart has a recognisable centre of gravity rather than one of everything.
#
# Must stay above the first table header: a bare key after one would be parsed
# as belonging to that table rather than to the document.
# ---------------------------------------------------------------------------

titles = [
  "Senior Backend Engineer",
  "Backend Engineer",
  "Senior Software Engineer",
  "Software Engineer (m/f/d)",
