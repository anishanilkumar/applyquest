# ---------------------------------------------------------------------------
# Coordinates for every location above, as [latitude, longitude].
#
# GermanyMap.tsx geocodes each distinct location through Nominatim at render
# time and caches the result in localStorage under `geocode_<lowercased name>`.
# That is fine for one user with a warm cache, but the demo gets cold browsers
# all day and the component fires every location in parallel — which is exactly
# what Nominatim's usage policy forbids, and it duly answers 429. seed.py emits
# these into boot.js, which pre-fills that same cache, so the map draws
# instantly and the demo never touches the service at all.
#
# Keys must be the lowercased location string. seed.py fails loudly if an
# application ends up somewhere that is not listed here.
# ---------------------------------------------------------------------------

[coordinates]
